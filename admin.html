<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo</title>

<link rel="stylesheet" href="style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#0f1115;
color:#fff;

}

header{

background:#00b050;

padding:20px;

text-align:center;

box-shadow:0 5px 20px rgba(0,0,0,.3);

}

header h1{

font-size:30px;

}

.painel{

max-width:1200px;

margin:25px auto;

padding:20px;

}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:25px;

}

.card{

background:#1b1f27;

border-radius:18px;

padding:20px;

box-shadow:0 0 15px rgba(0,255,120,.15);

transition:.3s;

}

.card:hover{

transform:translateY(-4px);

}

.card h2{

color:#00ff88;

margin-bottom:10px;

}

.numero{

font-size:42px;

font-weight:bold;

}

table{

width:100%;

border-collapse:collapse;

background:#1b1f27;

border-radius:15px;

overflow:hidden;

margin-top:20px;

}

th{

background:#00b050;

padding:15px;

}

td{

padding:12px;

border-bottom:1px solid #333;

}

button{

padding:14px 25px;

margin:10px;

border:none;

border-radius:10px;

cursor:pointer;

font-size:16px;

font-weight:bold;

background:#00b050;

color:white;

transition:.3s;

}

button:hover{

background:#009944;

transform:scale(1.05);

}

.acoes{

text-align:center;

margin-top:30px;

}

footer{

margin-top:40px;

text-align:center;

opacity:.7;

padding:20px;

}

</style>

</head>

<body>

<header>

<h1>

🎁 Painel Administrativo

</h1>

</header>

<div class="painel">

<div class="cards">

<div class="card">

<h2>👥 Participantes</h2>

<div class="numero" id="total">

0

</div>

</div>

<div class="card">

<h2>🔥 Ferro</h2>

<div id="ferro">

Disponível

</div>

</div>

<div class="card">

<h2>🥤 Liquidificador</h2>

<div id="liquidificador">

Disponível

</div>

</div>

<div class="card">

<h2>📊 Campanha</h2>

<div id="statusCampanha">

Carregando...

</div>

</div>

</div>

<h2>

🏆 Vencedores

</h2>

<table>

<thead>

<tr>

<th>Prêmio</th>

<th>Telefone</th>

<th>Data</th>

</tr>

</thead>

<tbody id="lista">

</tbody>

</table>

<div class="acoes">

<button id="novaCampanha">

🎁 Nova Campanha

</button>

<button id="encerrarCampanha">

🛑 Encerrar

</button>

<button id="exportar">

📄 Exportar CSV

</button>

<button onclick="reiniciar()">

🔄 Reiniciar

</button>

</div>

</div>

<footer>

GilFest © 2026

</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<script src="firebase.js"></script>

<script src="admin.js"></script>

</body>

</html>
