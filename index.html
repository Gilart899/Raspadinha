<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🍀 Raspadinha Premiada</title>

<meta name="theme-color" content="#0b7d2b">

<link rel="manifest" href="manifest.json">

<link rel="icon" href="icons/favicon.png">

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/animations.css">

</head>

<body>

<!-- FUNDO -->

<div id="background">

<div id="trevos"></div>

<div id="particulas"></div>

<div class="produto ferro"></div>

<div class="produto liquidificador"></div>

</div>

<!-- TOPO -->

<header>

<img
src="img/logo.png"
class="logo">

<h1>

🍀 RASPADINHA PREMIADA

</h1>

<p>

Concorra a um dos prêmios!

</p>

</header>

<!-- PRÊMIOS -->

<section class="premios">

<div class="card">

<img
src="img/ferro.png">

<h2>

Ferro Elétrico

</h2>

</div>

<div class="ou">

OU

</div>

<div class="card">

<img
src="img/liquidificador.png">

<h2>

Liquidificador

</h2>

</div>

</section>

<!-- BOTÃO -->

<section class="acao">

<button id="btnParticipar">

🎁 RASPE E CONCORRA

</button>

</section>

<!-- MODAL -->

<div
id="modal"
class="hidden">

<div class="janela">

<h2>

🍀 Boa sorte!

</h2>

<p>

Raspe toda a área abaixo.

</p>

<div id="raspadinha">

<canvas
id="canvas">
</canvas>

<div id="premio">

<img
id="imagemPremio">

<h1
id="textoPremio">

</h1>

</div>

</div>

<div class="botoes">

<button
id="compartilhar">

Compartilhar

</button>

<button
id="fechar">

Fechar

</button>

</div>

</div>

</div>

<!-- CONFETES -->

<div id="confetes"></div>

<!-- LOADING -->

<div id="loading">

<div class="spinner"></div>

<p>

Carregando...

</p>

</div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<!-- JS -->

<script src="js/config.js"></script>

<script src="js/firebase.js"></script>

<script src="js/firebase-service.js"></script>

<script src="js/effects.js"></script>

<script src="js/sounds.js"></script>

<script src="js/raspadinha.js"></script>

<script src="js/app.js"></script>

</body>

</html>
